[workspace]
resolver = "2"
members = ["crates/pdfminer", "crates/pdfminer-cli", "crates/pdfminer-node"]

[workspace.package]
version = "0.1.0+pdfminer.six.20260107"
edition = "2024"
license = "MIT"
repository = "https://github.com/FuelFwd/pdfminer-rs"
rust-version = "1.99"

[workspace.dependencies]
pdfminer = { path = "crates/pdfminer" }
indexmap = "2"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
unicode-normalization = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
